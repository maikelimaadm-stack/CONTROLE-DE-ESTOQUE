name: CI
on:
  push: { branches: ["**"] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
env:
  PNPM_VERSION: 10.33.0
  TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_test
  TEST_DATABASE_URL_APP: postgresql://erp_app_test:erp_app_test@127.0.0.1:5433/agro_erp_test
jobs:
  quality:
    name: Lint · Typecheck · Unit · Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (shared, domain, api)
        run: pnpm --filter @agro/shared test && pnpm --filter @erp/plataforma test && pnpm --filter @agro/domain test && pnpm --filter @agro/api test
      - name: Parity audit (all reference screens must be mapped)
        run: node scripts/parity.mjs --check
      - name: Secret scan (no credentials committed)
        run: |
          ! git grep -nE "(SUPABASE_SERVICE_ROLE_KEY|LOCAL_AUTH_SECRET|DATABASE_URL)=[^<$\"'{ ]{12,}" -- ':!.env.example' ':!docs' ':!.github' || (echo "possível segredo commitado" && exit 1)
  integration:
    name: Migrations · RLS · API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Migrations apply cleanly (fresh database)
        run: DATABASE_URL=$TEST_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts migrate
      - name: Schema + RLS tests (tenant isolation, ledger triggers)
        run: pnpm --filter @agro/db test:integration
      - name: API integration tests (permissions, multi-tenant, transactions, concurrency, idempotency)
        run: pnpm --filter @agro/api test:integration
  e2e:
    name: Build · E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_e2e }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_e2e
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Build API and web
        run: pnpm --filter @agro/api build && pnpm --filter @agro/web build
      # O runbook do pós-merge executa um comando DENTRO da imagem da API. Aqui o artefato real é montado
      # (`pnpm deploy --prod`, como no Dockerfile) e o comando é EXECUTADO: ele tem de recusar por falta de
      # conexão operacional — nunca por arquivo, script ou `tsx` ausente.
      - name: Comando operacional existe no artefato de produção
        run: node scripts/artefato-operacional.mjs --compilado --deploy
      - name: Seed e2e database (migrations + reference data + demo org)
        run: DATABASE_URL=$E2E_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts seed
      - run: pnpm --filter @agro/web exec playwright install --with-deps chromium
      - run: pnpm --filter @agro/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
  skew:
    name: Version skew · os dois sentidos entre a base e este HEAD
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_e2e }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_e2e
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Build web (HEAD novo)
        run: pnpm --filter @agro/web build
      # O banco é migrado e semeado pelo HEAD NOVO (0014, 0015 e as correções desta rodada). Só a API é antiga:
      # é exatamente a combinação da janela de rollout, em que o web sobe antes do servidor.
      - name: Seed e2e database (HEAD novo)
        run: DATABASE_URL=$E2E_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts seed
      # Uma árvore só serve aos dois sentidos: `--web` acrescenta o build do WEB daquele commit.
      - name: Montar a base (git worktree + build da API e do web daquele commit)
        run: node scripts/api-anterior.mjs --web
      - run: pnpm --filter @agro/web exec playwright install --with-deps chromium
      # SENTIDO 1 — o web desta PR contra a API que está no ar (o Vercel sobe antes do Railway).
      - name: E2E de version skew (web deste HEAD × API da base)
        run: pnpm --filter @agro/web exec playwright test -c playwright.skew.config.ts
      # SENTIDO 2 — o que a 05B realmente arrisca: a API canônica sobe antes, e todo navegador aberto ainda
      # roda o bundle da base. Se aquele cliente dependesse de qualquer resquício legado, quebra aqui.
      - name: E2E de version skew (web da base × API deste HEAD)
        run: pnpm --filter @agro/web exec playwright test -c playwright.skew-web-anterior.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report-skew, path: apps/web/playwright-report, retention-days: 7 }
