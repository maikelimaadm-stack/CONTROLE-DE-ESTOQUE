name: CI
on:
  # PR-DRIVEN: um único CI por commit.
  #
  # `push: ["**"]` + `pull_request` disparavam DUAS suítes completas para o mesmo commit de uma branch
  # com PR aberta — uma por evento —, e `concurrency` não as funde porque o `github.ref` difere
  # (`refs/heads/<branch>` contra `refs/pull/<n>/merge`). O custo não era só de minutos: dois resultados
  # para o MESMO SHA podem discordar, e foi assim que o commit 2363137 ficou verde num run e vermelho no
  # gêmeo. Agora branch com PR roda só pelo evento `pull_request`; `main` continua com CI pós-merge.
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
env:
  PNPM_VERSION: 10.33.0
  TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_test
  TEST_DATABASE_URL_APP: postgresql://erp_app_test:erp_app_test@127.0.0.1:5433/agro_erp_test
jobs:
  quality:
    name: Lint · Typecheck · Unit · Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (shared, domain, api)
        run: pnpm --filter @agro/shared test && pnpm --filter @erp/plataforma test && pnpm --filter @agro/domain test && pnpm --filter @agro/api test
      - name: Parity audit (all reference screens must be mapped)
        run: node scripts/parity.mjs --check
      - name: Secret scan (no credentials committed)
        run: |
          ! git grep -nE "(SUPABASE_SERVICE_ROLE_KEY|LOCAL_AUTH_SECRET|DATABASE_URL)=[^<$\"'{ ]{12,}" -- ':!.env.example' ':!docs' ':!.github' || (echo "possível segredo commitado" && exit 1)
  integration:
    name: Migrations · RLS · API integration
    runs-on: ubuntu-latest
    env:
      # A BASE DESTA EXECUÇÃO, para o gate 05C-2 — mesma razão e mesma fonte do job `skew`:
      # `pull_request.base.sha` é o SHA da base CAPTURADO para esta execução, então ele não muda se outra
      # PR entrar na main no meio do job. Num evento de `push` a expressão vem VAZIA, e aí o gate resolve
      # a ponta real de `origin/main` sozinho (buscando-a, porque o checkout é raso). O que ele NÃO faz
      # mais é cair num SHA literal: um gate ancorado em literal congelado mede o passado, não a PR.
      SKEW_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Migrations apply cleanly (fresh database)
        run: DATABASE_URL=$TEST_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts migrate
      - name: Schema + RLS tests (tenant isolation, ledger triggers)
        run: pnpm --filter @agro/db test:integration
      - name: API integration tests (permissions, multi-tenant, transactions, concurrency, idempotency)
        run: pnpm --filter @agro/api test:integration
      # A matriz do cutover do contador (PRE-BASE2-05C-2): dois quadrantes compatíveis e SEIS PROIBIDOS,
      # demonstrados contra um banco descartável. Numa PR que não atravessa o cutover — isto é, em toda PR
      # depois que a 05C-2 estiver em `main` — o gate se declara inativo e passa sem simular nada.
      - name: Matriz do cutover do contador de Empresa (gate 05C-2)
        run: pnpm gate:05c2
      # A matriz de version skew do HOTFIX da numeração de transferências: o quadrante que a fatia COMPRA
      # (binário BASE contra banco pós-0019, correto pelo alias) e os que continuam proibidos (API nova
      # antes da migration, com a janela silenciosa quando o acervo não começa em 1). Mesma expiração
      # automática do 05C-2: numa PR que não atravessa o hotfix, o gate se declara inativo e passa.
      - name: Matriz de version skew da numeração de transferências (gate 0019)
        run: pnpm gate:0019
  e2e:
    name: Build · E2E do escopo SUPORTADO (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_e2e }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_e2e
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Build API and web
        run: pnpm --filter @agro/api build && pnpm --filter @agro/web build
      # O runbook do pós-merge executa um comando DENTRO da imagem da API. Aqui o artefato real é montado
      # (`pnpm deploy --prod`, como no Dockerfile) e o comando é EXECUTADO: ele tem de recusar por falta de
      # conexão operacional — nunca por arquivo, script ou `tsx` ausente.
      - name: Comando operacional existe no artefato de produção
        run: node scripts/artefato-operacional.mjs --compilado --deploy
      - name: Seed e2e database (migrations + reference data + demo org)
        run: DATABASE_URL=$E2E_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts seed
      - run: pnpm --filter @agro/web exec playwright install --with-deps chromium
      # Escopo SUPORTADO de docs/UI-SUPPORT-MATRIX.md. O recorte mora no script `e2e` do pacote
      # (`--grep-invert @mobile`), e não aqui: um filtro escrito no workflow divergiria em silêncio
      # do que o desenvolvedor roda na máquina dele. Formato DEFERRED não bloqueia entrega, e por
      # isso não tem job obrigatório — a dívida continua executável por `pnpm e2e:mobile`.
      - name: E2E do escopo suportado (mobile está DEFERRED e fora do gate)
        run: pnpm --filter @agro/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
  skew:
    name: Version skew · os dois sentidos entre a base e este HEAD
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_e2e }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_e2e
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3333
      # A BASE DA PR, E NÃO A PONTA DE HOJE (PRE-BASE2-05C-0). `pull_request.base.sha` é o SHA da base
      # CAPTURADO PARA ESTA EXECUÇÃO. Resolver `origin/main` aqui compararia com o que a main for no momento
      # do job — se outra PR entrar no meio, o skew certifica um binário que não é a base desta. A
      # propriedade de que precisamos não é eternidade: é ficar PINADO durante o run, em vez de ser relido.
      # Num evento de push a expressão vem VAZIA, e o script trata vazio como ausente.
      SKEW_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
      # DIAGNÓSTICO APENAS. Num evento `pull_request` o `actions/checkout` posiciona a árvore num MERGE REF
      # sintético (o merge do head com a base), então `git rev-parse HEAD` NÃO é o head da PR. Isto deixa o
      # head declarado visível no log, separado do checkout. Não participa da resolução da base nem da
      # montagem da worktree — e o checkout sintético continua legítimo, não se exige igualdade com ele.
      SKEW_PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Build web (HEAD novo)
        run: pnpm --filter @agro/web build
      # O banco é migrado e semeado pelo HEAD NOVO (0014, 0015 e as correções desta rodada). Só a API é antiga:
      # é exatamente a combinação da janela de rollout, em que o web sobe antes do servidor.
      - name: Seed e2e database (HEAD novo)
        run: DATABASE_URL=$E2E_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts seed
      # Uma árvore só serve aos dois sentidos: `--web` acrescenta o build do WEB daquele commit.
      - name: Montar a base (git worktree + build da API e do web daquele commit)
        run: node scripts/api-anterior.mjs --web
      # ESTA EXECUÇÃO ATRAVESSA O CUTOVER DO CONTADOR? (PRE-BASE2-05C-2)
      # A 05C-2 renomeia a chave persistida do contador de Empresa, e isso torna a combinação do SENTIDO 1
      # — API da base × banco deste HEAD — um estado PROIBIDO, não uma janela de rollout. Quando é o caso,
      # aquele teste passa a exigir a RECUSA em vez da compatibilidade; não se desliga nada. A decisão sai
      # da comparação entre a constante do contador nos dois commits, então volta sozinha ao normal na
      # primeira PR cuja base já contenha o cutover. Falha fechado se não conseguir ler a base.
      - name: Esta execução atravessa o cutover do contador? (05C-2)
        run: node scripts/skew-cutover-contador.mjs --github-env
      # A API DA BASE JÁ TEM A DESCOBERTA DE CAPACIDADE DA TOP? (TOP-CONFIG-02)
      # A prova do sentido 1 depende do mundo em que ESTA PR vive: com a base anterior à #47 cobra-se o
      # bloqueio da tela; com a base posterior, cobra-se que a descoberta responde 200 com contractVersion 1
      # e que o web NÃO trata um servidor compatível como servidor antigo. A decisão sai da MEDIÇÃO da
      # árvore da base — não de SHA digitado nem de variável que alguém liga —, então expira sozinha e volta
      # ao mundo legado se a #47 for revertida. Falha fechado se não conseguir ler a base.
      - name: A API da base já tem a descoberta de capacidade da TOP? (TOP-CONFIG-02)
        run: node scripts/skew-capacidade-top.mjs --github-env
      # A API DA BASE JÁ DECLARA A EXECUÇÃO CONFIGURADA DA TOP? (TOP-CONFIG-04A)
      # Mesmo desenho do passo acima: sem o bloco `execucao` nas capacidades da base, o sentido 1 cobra que o
      # web esconde a execução, grava no formato 1 e que a base RECUSA o formato 2; com o bloco, cobra que o
      # web o reconhece. A decisão é MEDIDA na árvore da base e expira sozinha. Falha fechado.
      - name: A API da base já declara a execução configurada da TOP? (TOP-CONFIG-04A)
        run: node scripts/skew-execucao-top.mjs --github-env
      # A API DA BASE JÁ DECLARA A CLASSIFICAÇÃO FINANCEIRA DO DOCUMENTO DE VENDA? (VENDAS-A1)
      # Mesmo desenho: sem `capacidades.classificacaoFinanceira` na descoberta da base, o sentido 1 cobra que o
      # web NÃO mostra os dois campos e NÃO os envia no POST (a base os descartaria em silêncio); com ela,
      # cobra que o web os mostra. A decisão é MEDIDA na árvore da base e expira sozinha. Falha fechado.
      - name: A API da base já declara a classificação financeira da venda? (VENDAS-A1)
        run: node scripts/skew-classificacao-financeira.mjs --github-env
      # A API DA BASE JÁ DECLARA A CONDIÇÃO DE PAGAMENTO DO DOCUMENTO DE VENDA? (VENDAS-A4)
      # Mesmo desenho: sem `capacidades.condicaoPagamento` na descoberta da base, CP-K1 cobra que o web NÃO
      # mostra o campo e NÃO envia `condicao_pagamento_id` no POST (a base o descartaria em silêncio); com ela,
      # cobra que o web o mostra. A decisão é MEDIDA na árvore da base e expira sozinha. Falha fechado.
      - name: A API da base já declara a condição de pagamento da venda? (VENDAS-A4)
        run: node scripts/skew-condicao-pagamento.mjs --github-env
      # A API DA BASE JÁ SERVE A PRÉVIA DA CONFIRMAÇÃO DA VENDA? (VENDAS-A5-1)
      # Mesmo desenho: sem a rota `previa-confirmacao` declarada na base, o sentido 1 cobra que o diálogo
      # "Confirmar venda" deste web mostra o texto NEUTRO, com o botão habilitado, e que a confirmação funciona
      # (quem recusa é o servidor); com a rota, cobra que o diálogo mostra a prévia. A decisão é MEDIDA na
      # árvore da base e expira sozinha. Falha fechado.
      - name: A API da base já serve a prévia da confirmação da venda? (VENDAS-A5-1)
        run: node scripts/skew-previa-confirmacao.mjs --github-env
      # A BASE JÁ TEM A ESTRUTURA E AS FICHAS DE CADASTRO? (CADASTROS-ESTRUTURA e Fases 4 a 6, #62)
      # Mesmo desenho: sem a migration de uma fatia (0025, 0027, 0028, 0029, 0030) na árvore da base, o sentido 1 cobra
      # que a base RECUSA o corpo da web nova (422, nada gravado) e o sentido 2 que a API nova aceita o corpo
      # antigo; com ela, o sentido 1 cobra que a base ACEITA e grava o corpo novo, e o sentido 2 que a API nova
      # aceita o corpo que o web da base manda — conferidos no banco. A decisão é MEDIDA e expira sozinha. Falha fechado.
      - name: A base já tem a estrutura e as fichas de cadastro? (CADASTROS 0025–0030)
        run: node scripts/skew-fichas-cadastro.mjs --github-env
      - run: pnpm --filter @agro/web exec playwright install --with-deps chromium
      # SENTIDO 1 — o web desta PR contra a API que está no ar (o Vercel sobe antes do Railway).
      - name: E2E de version skew (web deste HEAD × API da base)
        run: pnpm --filter @agro/web exec playwright test -c playwright.skew.config.ts
      # SENTIDO 2 — o que a 05B realmente arrisca: a API canônica sobe antes, e todo navegador aberto ainda
      # roda o bundle da base. Se aquele cliente dependesse de qualquer resquício legado, quebra aqui.
      - name: E2E de version skew (web da base × API deste HEAD)
        run: pnpm --filter @agro/web exec playwright test -c playwright.skew-web-anterior.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report-skew, path: apps/web/playwright-report, retention-days: 7 }
