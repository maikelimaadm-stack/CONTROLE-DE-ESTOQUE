name: CI
on:
  push: { branches: ["**"] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
env:
  PNPM_VERSION: 10.33.0
  TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_test
  TEST_DATABASE_URL_APP: postgresql://erp_app_test:erp_app_test@127.0.0.1:5433/agro_erp_test
jobs:
  quality:
    name: Lint · Typecheck · Unit · Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (shared, domain, api)
        run: pnpm --filter @agro/shared test && pnpm --filter @erp/plataforma test && pnpm --filter @agro/domain test && pnpm --filter @agro/api test
      - name: Parity audit (all reference screens must be mapped)
        run: node scripts/parity.mjs --check
      - name: Secret scan (no credentials committed)
        run: |
          ! git grep -nE "(SUPABASE_SERVICE_ROLE_KEY|LOCAL_AUTH_SECRET|DATABASE_URL)=[^<$\"'{ ]{12,}" -- ':!.env.example' ':!docs' ':!.github' || (echo "possível segredo commitado" && exit 1)
  integration:
    name: Migrations · RLS · API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Migrations apply cleanly (fresh database)
        run: DATABASE_URL=$TEST_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts migrate
      - name: Schema + RLS tests (tenant isolation, ledger triggers)
        run: pnpm --filter @agro/db test:integration
      - name: API integration tests (permissions, multi-tenant, transactions, concurrency, idempotency)
        run: pnpm --filter @agro/api test:integration
  e2e:
    name: Build · E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: agro_erp_e2e }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/agro_erp_e2e
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agro/shared build && pnpm --filter @erp/plataforma build && pnpm --filter @agro/domain build && pnpm --filter @agro/db build
      - name: Build API and web
        run: pnpm --filter @agro/api build && pnpm --filter @agro/web build
      - name: Seed e2e database (migrations + reference data + demo org)
        run: DATABASE_URL=$E2E_DATABASE_URL pnpm --filter @agro/db exec tsx src/cli.ts seed
      - run: pnpm --filter @agro/web exec playwright install --with-deps chromium
      - run: pnpm --filter @agro/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
